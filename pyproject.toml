[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebra"
version = "0.1.0"
description = "YouTube Video Intelligence MCP Server"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "SegmentationFault", email = "team@example.com" }
]
dependencies = [
  "mcp>=1.9.0,<2",   # server uses the 1.x low-level Server decorators (ADR-A); mcp 2.x differs
  "httpx>=0.27.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "google-api-python-client>=2.126.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "keyring>=25.2.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "respx>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.0",
  "types-requests>=2.31.0",
]

[project.scripts]
cerebra = "cerebra.mcp_server:main"
cerebra-cli = "cerebra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: fast unit tests",
  "property: Hypothesis property tests",
  "contract: adapter contract tests",
  "integration: integration tests with real SQLite",
  "mcp_e2e: MCP end-to-end tests",
  "security: security tests",
  "concurrency: concurrency tests",
  "performance: performance tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cerebra/domain", "src/cerebra/application"]
explicit_package_bases = true

[tool.coverage.run]
source = ["src/cerebra"]
branch = true
omit = ["*/mcp_server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
