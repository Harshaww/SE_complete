name: live-api-write

# Manual-only live write test (ADR-A, FR-4, Phase 4 gate)
# NEVER runs automatically — human must dispatch
# Uses dedicated test account; creates ONE clearly named PRIVATE test playlist

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'I-CONFIRM-WRITE-TO-TEST-ACCOUNT' to proceed"
        required: true

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "I-CONFIRM-WRITE-TO-TEST-ACCOUNT" ]; then
            echo "ERROR: Confirmation string does not match. Aborting."
            exit 1
          fi

  live-write:
    needs: gate-check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      CEREBRA_QUOTA_BUDGET: "2000"
      CEREBRA_SEARCH_BUDGET: "10"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_TEST }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_TEST }}
      CEREBRA_REFRESH_TOKEN: ${{ secrets.CEREBRA_REFRESH_TOKEN_WRITE_TEST }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run write test (creates ONE private test playlist)
        run: |
          pytest tests/integration -m "live_write" -v \
            --tb=short \
            -k "test_create_private_test_playlist" \
            --junitxml=write-results.xml
        # NOTE: NFR-SA-2 — NEVER deletes or edits existing content
        # Test playlist name: "CEREBRA-CI-TEST-{run_id}" — clearly marked
