name: cerebra-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # NFR-TE-1, TR-5: NO live API calls in PR CI
    env:
      PYTHONPATH: src
      CEREBRA_QUOTA_BUDGET: "1000"
      CEREBRA_SEARCH_BUDGET: "10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run property tests (Hypothesis)
        run: pytest tests/property -v --tb=short

      - name: Run contract tests
        run: pytest tests/contract -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

      - name: Run MCP e2e tests (fixture provider)
        run: pytest tests/mcp_e2e -v --tb=short

      - name: Run security tests
        run: pytest tests/security -v --tb=short

      - name: Coverage report
        run: |
          pytest tests/unit tests/property \
            --cov=cerebra \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SKILL.md files
        run: python scripts/validate_skills.py

      - name: Validate brain notes
        run: python scripts/validate_brain.py

      - name: Check traceability matrix (PR-4)
        run: python scripts/traceability.py

  # NFR-SE-6: dependency vulnerability scan
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit
